# Site Nginx du Smart Dashboard (installé par deploy/install.sh).
# __DOMAIN__ est remplacé par ton domaine ; Certbot ajoute ensuite le bloc HTTPS
# et la redirection HTTP → HTTPS. Tes autres sites (phpMyAdmin…) ne sont pas touchés.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Captures d'écran envoyées par la tablette, sauvegardes importées
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
